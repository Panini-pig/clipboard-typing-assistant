<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iframe 子页面</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #fbfcff;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 64px;
        padding: 8px 10px;
        border: 1px solid #d6dbe7;
        border-radius: 8px;
        font: inherit;
        font-size: 13.5px;
        outline: none;
        resize: none;
      }
      textarea:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }
      #frame-log {
        margin-top: 6px;
        color: #667089;
        font-size: 11.5px;
        font-family: ui-monospace, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <textarea id="ta-frame" onpaste="return false" placeholder="iframe 内的 textarea"></textarea>
    <div id="frame-log">等待输入…</div>
    <script>
      let pasteCount = 0;
      document.addEventListener(
        'paste',
        (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          pasteCount += 1;
          document.getElementById('frame-log').textContent =
            'paste 被拦截 ' + pasteCount + ' 次（input 0 次）';
        },
        true
      );

      let inputCount = 0;
      document.getElementById('ta-frame').addEventListener('input', (event) => {
        inputCount += 1;
        document.getElementById('frame-log').textContent =
          'paste 被拦截 ' + pasteCount + ' 次（input ' + inputCount + ' 次）';
      });
    </script>
  </body>
</html>
